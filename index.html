<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MGRSTool</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>MGRS → WGS84</h1>
      <p class="lede">
        Введіть координату MGRS. Отримаєте широту і довготу (WGS84).
      </p>

      <section>
        <label for="mgrs">MGRS</label>
        <input
          id="mgrs"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="наприклад 33TWN0838825205"
        />

        <div class="actions">
          <button id="convert" type="button">Конвертувати</button>
          <button id="example" type="button" class="secondary">Приклад</button>
        </div>

        <p id="error" class="error" hidden></p>

        <dl id="result" hidden>
          <div>
            <dt>Широта</dt>
            <dd id="lat"></dd>
          </div>
          <div>
            <dt>Довгота</dt>
            <dd id="lon"></dd>
          </div>
          <div>
            <dt>WGS84</dt>
            <dd id="pair"></dd>
          </div>
        </dl>

        <div class="actions" id="result-actions" hidden>
          <button id="copy-pair" type="button" class="secondary">
            Копіювати
          </button>
          <a id="map-link" href="#" target="_blank" rel="noopener noreferrer" class="button secondary">
            Відкрити на карті
          </a>
        </div>
      </section>

      <hr />

      <section>
        <label for="batch">Список MGRS</label>
        <textarea
          id="batch"
          rows="6"
          spellcheck="false"
          placeholder="35U PU 12345 67890&#10;35U PU 54321 98765&#10;35U PU 11111 22222"
        ></textarea>

        <div class="actions">
          <button id="batch-convert" type="button">Конвертувати</button>
          <button id="copy-csv" type="button" class="secondary" hidden>
            Копіювати CSV
          </button>
        </div>

        <div id="batch-table-wrap" hidden>
          <table id="batch-table">
            <thead>
              <tr>
                <th>MGRS</th>
                <th>Широта</th>
                <th>Довгота</th>
                <th>Карта</th>
              </tr>
            </thead>
            <tbody id="batch-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="vendor/mgrs.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
